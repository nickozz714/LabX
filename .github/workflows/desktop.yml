# Desktop builds — Tauri shell voor macOS en Windows (Linux bewust niet).
# Draait op elke versietag (v*) en handmatig via workflow_dispatch; de
# installers verschijnen als workflow-artifacts (unsigned — signing/notarisatie
# is een aparte, latere stap met certificaten als secrets).
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Nodig om op een tag de installers aan een GitHub Release te hangen —
# Releases zijn zonder GitHub-login te downloaden, workflow-artifacts niet.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Eén dmg die op Apple Silicon ÉN op Intel draait. `macos-latest` is
          # inmiddels een ARM-runner, dus een gewone build levert alleen een
          # aarch64-dmg op en staat een Intel-Mac met lege handen — precies wat
          # er t/m v0.1.38 gebeurde. `universal-apple-darwin` bouwt beide
          # architecturen en lipo't ze tot één binary; dat kost bouwtijd en wat
          # bestandsgrootte, maar levert één download op die het altijd doet.
          # Een tweede Intel-runner (macos-13) zou het ook oplossen, maar die
          # generatie runners loopt af en dan zijn we hier weer.
          - os: macos-latest
            artifact: labx-desktop-macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            bundle_paths: |
              desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact: labx-desktop-windows
            # Het host-target expliciet: `targets:` leeg laten is vragen om een
            # `rustup target add ""`.
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: ""
            bundle_paths: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Stem de app-versie af op de tag (installernaam = release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "$V"
          echo "app-versie gezet op $V"

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build installers
        working-directory: desktop
        run: npm run tauri build -- ${{ matrix.tauri_args }}

      # EERST de Release, dan pas het artifact. Andersom ging het mis: het
      # uploaden van artifacts liep tegen het opslagquotum van het account
      # ("Artifact storage quota has been hit") en liet de job falen VÓÓR de
      # release-stap. Gevolg: v0.1.17 t/m v0.1.37 hebben wel images op GHCR maar
      # geen installers — de Releases-pagina, waar README en wiki naartoe
      # wijzen, bleef drie weken op v0.1.16 staan terwijl de builds zelf prima
      # slaagden.
      - name: Attach installers to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bundle_paths }}
          # Maar één van de twee matrix-jobs mag de notities genereren. Doen ze
          # het allebei, dan plakt de tweede ze achter de eerste en staat de
          # changelog twee keer in de release — zoals bij v0.1.38 gebeurde.
          generate_release_notes: ${{ matrix.os == 'macos-latest' }}

      # Alleen voor een handmatige build zónder tag: dan is er geen release om
      # het aan te hangen en is het artifact de enige manier om erbij te komen.
      # Op een tag zou het alleen maar quotum opsouperen voor een tweede kopie
      # van wat al aan de release hangt.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error
          retention-days: 7
