# Desktop builds — Tauri shell voor macOS en Windows (Linux bewust niet).
# Draait op elke versietag (v*) en handmatig via workflow_dispatch; de
# installers verschijnen als workflow-artifacts (unsigned — signing/notarisatie
# is een aparte, latere stap met certificaten als secrets).
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Nodig om op een tag de installers aan een GitHub Release te hangen —
# Releases zijn zonder GitHub-login te downloaden, workflow-artifacts niet.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: labx-desktop-macos
            bundle_paths: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact: labx-desktop-windows
            bundle_paths: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Stem de app-versie af op de tag (installernaam = release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "$V"
          echo "app-versie gezet op $V"

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build installers
        working-directory: desktop
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error

      - name: Attach installers to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bundle_paths }}
