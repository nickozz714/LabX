server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # De bundels hebben een hash in de naam en veranderen dus nooit van inhoud:
    # die mogen voor altijd in de cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html juist NOOIT cachen. Hij is het enige bestand dat naar de nieuwe
    # bundelnaam wijst; wordt hij uit de cache geserveerd, dan blijft de browser
    # na een deploy de oude app draaien — ook na een gewone herlaadactie, want
    # zonder Cache-Control cachet een browser hem op eigen houtje (heuristisch)
    # en vraagt hij niet eens of er een nieuwere is. Precies dat gebeurde na
    # v0.1.36: de server had de nieuwe app, het tabblad draaide de oude.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — client-side routing (react-router)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WebSocket (terminal, and any future ws) to the backend.
    # LABX_API_URL is baked in at container start via envsubst in principle;
    # for the POC we point straight at the compose service name.
    location /api/ {
        proxy_pass http://api:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
