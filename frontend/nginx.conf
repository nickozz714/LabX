server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # De bundels hebben een hash in de naam en veranderen dus nooit van inhoud:
    # die mogen voor altijd in de cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html juist NOOIT cachen. Hij is het enige bestand dat naar de nieuwe
    # bundelnaam wijst; wordt hij uit de cache geserveerd, dan blijft de browser
    # na een deploy de oude app draaien — ook na een gewone herlaadactie, want
    # zonder Cache-Control cachet een browser hem op eigen houtje (heuristisch)
    # en vraagt hij niet eens of er een nieuwere is. Precies dat gebeurde na
    # v0.1.36: de server had de nieuwe app, het tabblad draaide de oude.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — client-side routing (react-router)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WebSocket (terminal, and any future ws) to the backend.
    #
    # De omweg via $api_upstream is geen stijl maar een reparatie. Met een
    # letterlijke hostnaam in proxy_pass zoekt nginx het IP ÉÉN keer op, bij
    # het starten, en houdt het daarna vast. Krijgt de api-container bij een
    # uitrol een nieuw IP -- en dat gebeurt zodra compose hem opnieuw aanmaakt
    # terwijl deze container blijft draaien -- dan praat nginx tegen een adres
    # dat niet meer bestaat en geeft ALLES onder /api/ een 502. De pagina laadt
    # dan gewoon, dus het ziet eruit als "de app is stuk" en niet als "de
    # proxy wijst verkeerd". Precies dat gebeurde bij de uitrol van v0.8.0.
    #
    # Met een variabele resolvet nginx per aanvraag, via de ingebouwde DNS van
    # Docker (127.0.0.11), met een geldigheid van 10 seconden. $request_uri in
    # plaats van een pad achter de poort, want bij een variabele doet nginx de
    # location-prefix niet zelf -- het pad moet er dus voluit in.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8090$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
