server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + WebSocket (terminal, and any future ws) to the backend.
    # LABX_API_URL is baked in at container start via envsubst in principle;
    # for the POC we point straight at the compose service name.
    location /api/ {
        proxy_pass http://api:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
