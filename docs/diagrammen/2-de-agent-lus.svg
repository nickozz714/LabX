<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t2">
  <title id="t2">De agent-lus: vier stappen, met een poort ervoor en een poort erna</title>
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#3B82F6"/>
    </marker>
    <marker id="aw" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#D97706"/>
    </marker>
    <marker id="ag" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    .f { font-family: Archivo, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: #0B1220; }
    .sub { font-size: 18px; fill: #64748B; }
    .eyebrow { font-size: 14px; font-weight: 700; fill: #94A3B8; letter-spacing: 2.4px; }
    .h { font-size: 19px; font-weight: 700; fill: #0B1220; }
    .lab { font-size: 14.5px; fill: #334155; }
    .sm { font-size: 13.5px; fill: #64748B; }
    .num { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.1px; }
  </style>

  <rect width="1600" height="900" fill="#FBFCFE"/>
  <rect x="0" y="0" width="1600" height="6" fill="#3B82F6"/>

  <text class="f eyebrow" x="70" y="78">PLAAT 2 — DE WERKING</text>
  <text class="f title" x="70" y="122">Wat er gebeurt tussen opdracht en verslag</text>
  <text class="f sub" x="70" y="156">Vier stappen, met een poort ervoor en een poort erna. De guard zit in de lus, niet erachter.</text>

  <rect x="70" y="248" width="260" height="176" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="100" cy="280" r="16" fill="#3B82F6"/>
  <text class="f num" x="100" y="286" text-anchor="middle">1</text>
  <text class="f h" x="128" y="286">Opdracht</text>
  <text class="f lab" x="94" y="326">Een chatbericht, een</text>
  <text class="f lab" x="94" y="350">ticket, of een schedule</text>
  <text class="f lab" x="94" y="374">die afgaat.</text>
  <text class="f sm" x="94" y="402">Met bijlagen, desgewenst.</text>

  <line x1="330" y1="336" x2="348" y2="336" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="354" y="248" width="260" height="176" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="384" cy="280" r="16" fill="#3B82F6"/>
  <text class="f num" x="384" y="286" text-anchor="middle">2</text>
  <text class="f h" x="412" y="286">De agent kiest</text>
  <text class="f lab" x="378" y="326">Ziet alleen naam en</text>
  <text class="f lab" x="378" y="350">beschrijving van elke</text>
  <text class="f lab" x="378" y="374">toegestane tool.</text>
  <text class="f sm" x="378" y="402">Schema laadt pas bij gebruik.</text>

  <line x1="614" y1="336" x2="632" y2="336" stroke="#D97706" stroke-width="2.5" marker-end="url(#aw)"/>

  <rect x="638" y="232" width="150" height="208" rx="13" fill="#1E293B"/>
  <rect x="638" y="232" width="150" height="7" rx="3.5" fill="#D97706"/>
  <text class="f tag" x="713" y="272" text-anchor="middle" fill="#FBBF24">POORT</text>
  <text class="f tag" x="713" y="292" text-anchor="middle" fill="#FBBF24">INVOER</text>
  <line x1="662" y1="310" x2="764" y2="310" stroke="#475569" stroke-width="2"/>
  <text class="f" x="713" y="338" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Mag dit</text>
  <text class="f" x="713" y="358" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">gevraagd</text>
  <text class="f" x="713" y="378" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">worden?</text>
  <text class="f" x="713" y="406" text-anchor="middle" font-size="12" fill="#94A3B8">tegenhouden is beter</text>
  <text class="f" x="713" y="424" text-anchor="middle" font-size="12" fill="#94A3B8">dan achteraf opruimen</text>

  <line x1="788" y1="336" x2="806" y2="336" stroke="#D97706" stroke-width="2.5" marker-end="url(#aw)"/>

  <rect x="812" y="248" width="260" height="176" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
  <circle cx="842" cy="280" r="16" fill="#3B82F6"/>
  <text class="f num" x="842" y="286" text-anchor="middle">3</text>
  <text class="f h" x="870" y="286">Uitvoeren</text>
  <text class="f lab" x="836" y="326">In het lab: een commando,</text>
  <text class="f lab" x="836" y="350">een MCP-tool, een script,</text>
  <text class="f lab" x="836" y="374">een build of een test.</text>
  <text class="f sm" x="836" y="402">Hier gebeurt het echte werk.</text>

  <line x1="1072" y1="336" x2="1090" y2="336" stroke="#D97706" stroke-width="2.5" marker-end="url(#aw)"/>

  <rect x="1096" y="232" width="150" height="208" rx="13" fill="#1E293B"/>
  <rect x="1096" y="232" width="150" height="7" rx="3.5" fill="#D97706"/>
  <text class="f tag" x="1171" y="272" text-anchor="middle" fill="#FBBF24">POORT</text>
  <text class="f tag" x="1171" y="292" text-anchor="middle" fill="#FBBF24">UITVOER</text>
  <line x1="1120" y1="310" x2="1222" y2="310" stroke="#475569" stroke-width="2"/>
  <text class="f" x="1171" y="338" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Wat komt</text>
  <text class="f" x="1171" y="358" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">er terug?</text>
  <text class="f" x="1171" y="386" text-anchor="middle" font-size="12" fill="#34D399">doorlaten</text>
  <text class="f" x="1171" y="405" text-anchor="middle" font-size="12" fill="#FBBF24">maskeren</text>
  <text class="f" x="1171" y="424" text-anchor="middle" font-size="12" fill="#F87171">blokkeren</text>

  <line x1="1246" y1="336" x2="1264" y2="336" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="1270" y="248" width="260" height="176" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="1300" cy="280" r="16" fill="#3B82F6"/>
  <text class="f num" x="1300" y="286" text-anchor="middle">4</text>
  <text class="f h" x="1328" y="286">Verslag</text>
  <text class="f lab" x="1294" y="326">Op het ticket, in de chat,</text>
  <text class="f lab" x="1294" y="350">of als melding per mail.</text>
  <text class="f sm" x="1294" y="382">De agent ziet alleen wat de</text>
  <text class="f sm" x="1294" y="402">poort heeft doorgelaten.</text>

  <path d="M1400 424 L1400 496 Q1400 516 1380 516 L220 516 Q200 516 200 496 L200 424"
        fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ag)"/>
  <rect x="628" y="494" width="344" height="44" rx="10" fill="#FBFCFE"/>
  <text class="f lab" x="800" y="523" text-anchor="middle" fill="#64748B">…en weer een ronde, tot het werk af is</text>

  <rect x="70" y="584" width="712" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="106" y="622" fill="#94A3B8">WAT DE AGENT MEEKRIJGT</text>
  <text class="f h" x="106" y="658">Context die hij niet zelf hoeft te zoeken</text>
  <circle cx="116" cy="694" r="4" fill="#3B82F6"/>
  <text class="f lab" x="134" y="700">De opdracht, de acceptatiecriteria en de tijdlijn van het ticket</text>
  <circle cx="116" cy="726" r="4" fill="#3B82F6"/>
  <text class="f lab" x="134" y="732">Skills: how-to-kennis met instructies per tool</text>
  <circle cx="116" cy="758" r="4" fill="#3B82F6"/>
  <text class="f lab" x="134" y="764">Zijn eigen vorige sessie — hij weet nog wat hij gedaan heeft</text>
  <circle cx="116" cy="790" r="4" fill="#E08C1E"/>
  <text class="f lab" x="134" y="796">Kennis uit Nectar, bij elke prompt opnieuw (zie plaat 3)</text>

  <rect x="818" y="584" width="712" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="854" y="622" fill="#94A3B8">WAT JIJ ONDERTUSSEN ZIET</text>
  <text class="f h" x="854" y="658">Live, en het loopt door als je wegklikt</text>
  <circle cx="864" cy="694" r="4" fill="#8B5CF6"/>
  <text class="f lab" x="882" y="700">Elke stap en elke afweging, terwijl hij ze zet</text>
  <circle cx="864" cy="726" r="4" fill="#8B5CF6"/>
  <text class="f lab" x="882" y="732">Tokenteller en context-indicator</text>
  <circle cx="864" cy="758" r="4" fill="#8B5CF6"/>
  <text class="f lab" x="882" y="764">Wat een poort tegenhield, en waarom</text>
  <circle cx="864" cy="790" r="4" fill="#8B5CF6"/>
  <text class="f lab" x="882" y="796">Een knop om hem te stoppen — ook als hij vastloopt</text>
</svg>
