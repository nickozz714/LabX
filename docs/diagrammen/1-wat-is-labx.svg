<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t1">
  <title id="t1">Wat LabX is: een agent met een eigen afgeschermde werkplaats</title>
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#64748B"/>
    </marker>
    <marker id="ablue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#3B82F6"/>
    </marker>
    <marker id="aamber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#D97706"/>
    </marker>
  </defs>
  <style>
    .f { font-family: Archivo, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: #0B1220; }
    .sub { font-size: 19px; fill: #64748B; }
    .eyebrow { font-size: 14px; font-weight: 700; fill: #94A3B8; letter-spacing: 2.4px; }
    .h { font-size: 20px; font-weight: 700; fill: #0B1220; }
    .lab { font-size: 15.5px; fill: #334155; }
    .sm { font-size: 14px; fill: #64748B; }
    .tag { font-size: 13px; font-weight: 700; letter-spacing: 1.1px; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 13.5px; fill: #475569; }
  </style>

  <rect width="1600" height="900" fill="#FBFCFE"/>
  <rect x="0" y="0" width="1600" height="6" fill="#3B82F6"/>

  <text class="f eyebrow" x="70" y="78">PLAAT 1 — DE KERN</text>
  <text class="f title" x="70" y="122">Een agent met een eigen, afgeschermde werkplaats</text>
  <text class="f sub" x="70" y="156">De agent mag binnen het lab vrijwel alles. Alles wat het lab verlaat gaat eerst langs de guard.</text>

  <!-- jij -->
  <rect x="70" y="316" width="196" height="184" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="168" cy="374" r="25" fill="#EAF1FE" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="168" cy="366" r="8.5" fill="#3B82F6"/>
  <path d="M152 388 a16 16 0 0 1 32 0" fill="#3B82F6"/>
  <text class="f h" x="168" y="434" text-anchor="middle">Jij</text>
  <text class="f sm" x="168" y="460" text-anchor="middle">geeft de opdracht,</text>
  <text class="f sm" x="168" y="480" text-anchor="middle">bepaalt de grenzen</text>

  <line x1="266" y1="408" x2="322" y2="408" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- LabX + de agent -->
  <rect x="330" y="270" width="290" height="276" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
  <rect x="330" y="270" width="290" height="44" rx="14" fill="#3B82F6"/>
  <rect x="330" y="300" width="290" height="14" fill="#3B82F6"/>
  <text class="f tag" x="475" y="300" text-anchor="middle" fill="#FFFFFF">LABX — EN DE AGENT</text>

  <rect x="358" y="336" width="234" height="96" rx="11" fill="#EAF1FE"/>
  <text class="f h" x="475" y="370" text-anchor="middle">Claude Code CLI</text>
  <text class="f sm" x="475" y="394" text-anchor="middle">denkt, kiest, vraagt</text>
  <text class="f sm" x="475" y="416" text-anchor="middle">maar raakt zelf niets aan</text>

  <text class="f lab" x="475" y="460" text-anchor="middle">Chat · Boards · Skills</text>
  <text class="f lab" x="475" y="484" text-anchor="middle">Workflows · Schedules</text>
  <text class="f mono" x="475" y="516" text-anchor="middle">start de labs via docker.sock</text>

  <!-- de guard ALS de wand van de sandbox -->
  <rect x="648" y="222" width="94" height="418" rx="14" fill="#1E293B"/>
  <rect x="648" y="222" width="94" height="8" rx="4" fill="#D97706"/>
  <text class="f tag" x="695" y="284" text-anchor="middle" fill="#FBBF24">DATA</text>
  <text class="f tag" x="695" y="304" text-anchor="middle" fill="#FBBF24">GUARD</text>
  <line x1="668" y1="326" x2="722" y2="326" stroke="#475569" stroke-width="2"/>
  <text class="f" x="695" y="360" text-anchor="middle" font-size="13" fill="#CBD5E1">alles wat</text>
  <text class="f" x="695" y="380" text-anchor="middle" font-size="13" fill="#CBD5E1">het lab</text>
  <text class="f" x="695" y="400" text-anchor="middle" font-size="13" fill="#CBD5E1">verlaat,</text>
  <text class="f" x="695" y="420" text-anchor="middle" font-size="13" fill="#CBD5E1">komt hier</text>
  <text class="f" x="695" y="440" text-anchor="middle" font-size="13" fill="#CBD5E1">langs</text>
  <line x1="668" y1="464" x2="722" y2="464" stroke="#475569" stroke-width="2"/>
  <text class="f" x="695" y="496" text-anchor="middle" font-size="12.5" font-weight="700" fill="#34D399">doorlaten</text>
  <text class="f" x="695" y="520" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FBBF24">maskeren</text>
  <text class="f" x="695" y="544" text-anchor="middle" font-size="12.5" font-weight="700" fill="#F87171">blokkeren</text>

  <!-- opdracht erheen, uitvoer terug -->
  <path d="M620 352 L642 352" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ablue)"/>
  <path d="M748 352 L784 352" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ablue)"/>
  <text class="f" x="700" y="204" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3B82F6">opdracht →</text>

  <path d="M784 476 L748 476" stroke="#D97706" stroke-width="3" marker-end="url(#aamber)"/>
  <path d="M642 476 L620 476" stroke="#D97706" stroke-width="3" marker-end="url(#aamber)"/>
  <text class="f" x="700" y="672" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B45309">← uitvoer, getoetst</text>

  <!-- sandbox -->
  <rect x="792" y="222" width="440" height="418" rx="18" fill="#F8FAFF" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text class="f tag" x="816" y="256" fill="#64748B">HET LAB — WEGWERPBARE SANDBOX</text>

  <rect x="818" y="278" width="186" height="118" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f h" x="911" y="314" text-anchor="middle">Werker 1</text>
  <text class="f sm" x="911" y="340" text-anchor="middle">shell · bestanden</text>
  <text class="f sm" x="911" y="362" text-anchor="middle">installeert wat hij mist</text>
  <text class="f sm" x="911" y="384" text-anchor="middle">1 CPU · 2 GB</text>

  <rect x="1020" y="278" width="186" height="118" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f h" x="1113" y="314" text-anchor="middle">Werker 2</text>
  <text class="f sm" x="1113" y="340" text-anchor="middle">deelt /workspace</text>
  <text class="f sm" x="1113" y="362" text-anchor="middle">schaalt mee met werk</text>
  <text class="f sm" x="1113" y="384" text-anchor="middle">1 CPU · 2 GB</text>

  <rect x="818" y="412" width="388" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f h" x="1012" y="448" text-anchor="middle">Wat erin zit</text>
  <text class="f lab" x="1012" y="480" text-anchor="middle">repositories · bestanden · geheimen</text>
  <text class="f lab" x="1012" y="506" text-anchor="middle">de Azure-sessie · MCP-tools · skills</text>
  <text class="f lab" x="1012" y="532" text-anchor="middle">een eigen browser</text>
  <line x1="850" y1="556" x2="1174" y2="556" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f sm" x="1012" y="584" text-anchor="middle">Lab weg = alles weg. Geen restanten op de host.</text>

  <!-- buitenwereld -->
  <rect x="1300" y="222" width="230" height="418" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="1415" y="256" text-anchor="middle" fill="#64748B">BUITENWERELD</text>
  <text class="f lab" x="1415" y="304" text-anchor="middle">Git · GitHub</text>
  <text class="f lab" x="1415" y="338" text-anchor="middle">Jira · Azure DevOps</text>
  <text class="f lab" x="1415" y="372" text-anchor="middle">Azure · Fabric</text>
  <text class="f lab" x="1415" y="406" text-anchor="middle">Teams · Outlook</text>
  <text class="f lab" x="1415" y="440" text-anchor="middle">Internet</text>
  <line x1="1332" y1="472" x2="1498" y2="472" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f sm" x="1415" y="504" text-anchor="middle">Het lab praat hier zelf mee,</text>
  <text class="f sm" x="1415" y="526" text-anchor="middle">met een allowlist die jij zet.</text>
  <text class="f sm" x="1415" y="560" text-anchor="middle">Netwerk per lab helemaal</text>
  <text class="f sm" x="1415" y="582" text-anchor="middle">uit te zetten.</text>

  <path d="M1232 402 L1292 402" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1292 442 L1232 442" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- bottom band -->
  <rect x="70" y="700" width="1460" height="130" rx="14" fill="#F1F5F9"/>
  <text class="f h" x="110" y="742">De drie beloftes</text>
  <text class="f lab" x="110" y="778">Echt werk — een volledige shell, geen chat-theater.</text>
  <text class="f lab" x="590" y="778">Afgeschermd — wegwerpbaar, en bewaakt op de uitgang.</text>
  <text class="f lab" x="1060" y="778">Van jou — het draait op jouw machine.</text>
  <rect x="110" y="794" width="46" height="4" rx="2" fill="#3B82F6"/>
  <rect x="590" y="794" width="46" height="4" rx="2" fill="#D97706"/>
  <rect x="1060" y="794" width="46" height="4" rx="2" fill="#8B5CF6"/>
</svg>
