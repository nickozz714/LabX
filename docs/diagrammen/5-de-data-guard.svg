<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t5">
  <title id="t5">De data-guard: controle op de invoer én op de uitvoer, en alles is instelbaar</title>
  <defs>
    <marker id="ai" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#334155"/>
    </marker>
    <marker id="ag" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#0E9F6E"/>
    </marker>
    <marker id="aw" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#D97706"/>
    </marker>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#DC2626"/>
    </marker>
  </defs>
  <style>
    .f { font-family: Archivo, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 37px; font-weight: 700; fill: #0B1220; }
    .sub { font-size: 18px; fill: #64748B; }
    .eyebrow { font-size: 14px; font-weight: 700; fill: #94A3B8; letter-spacing: 2.4px; }
    .h { font-size: 19px; font-weight: 700; fill: #0B1220; }
    .lab { font-size: 14.5px; fill: #334155; }
    .sm { font-size: 13.5px; fill: #64748B; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.1px; }
    .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12.5px; }
    .pil { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  </style>

  <rect width="1600" height="900" fill="#FBFCFE"/>
  <rect x="0" y="0" width="1600" height="6" fill="#1E293B"/>

  <text class="f eyebrow" x="70" y="76">PLAAT 5 — DE GRENS</text>
  <text class="f title" x="70" y="120">Twee poorten: één op wat erin gaat, één op wat eruit komt</text>
  <text class="f sub" x="70" y="153">Vorm liegt. Daarom beslist niet het commando maar de uitvoer — en staat elke regel bij jou.</text>

  <!-- ============ POORT 1 — INVOER ============ -->
  <rect x="70" y="196" width="330" height="392" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="70" y="196" width="330" height="42" rx="14" fill="#1E293B"/>
  <rect x="70" y="224" width="330" height="14" fill="#1E293B"/>
  <text class="f tag" x="94" y="224" fill="#FFFFFF">POORT 1 · INVOERCONTROLE</text>

  <text class="f h" x="94" y="272">Wat het lab in gaat</text>
  <text class="f sm" x="94" y="298">Het commando wordt getoetst vóór het draait.</text>

  <rect x="94" y="316" width="282" height="62" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text class="f mono" x="110" y="340" fill="#334155">SELECT COLUMN_NAME</text>
  <text class="f mono" x="110" y="362" fill="#334155">FROM INFORMATION_SCHEMA</text>

  <text class="f sm" x="94" y="404">Lijkt op rijen ophalen. De verklaarde intentie</text>
  <text class="f sm" x="94" y="424">"metadata" verruimt dit — er komt immers een</text>
  <text class="f sm" x="94" y="444">kolommenlijst uit, geen gegevens.</text>

  <line x1="94" y1="466" x2="376" y2="466" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="94" y="492" fill="#94A3B8">DE UITKOMST HIER</text>
  <text class="f lab" x="94" y="518">Uitvoeren, of tegenhouden voordat er</text>
  <text class="f lab" x="94" y="540">iets gebeurd is.</text>
  <text class="f sm" x="94" y="566">Regels met doel <tspan class="mono" fill="#334155">opdracht</tspan> gelden hier.</text>

  <path d="M400 392 L436 392" stroke="#334155" stroke-width="2.5" marker-end="url(#ai)"/>

  <!-- ============ HET LAB ============ -->
  <rect x="446" y="196" width="196" height="392" rx="14" fill="#F8FAFF" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text class="f tag" x="470" y="228" fill="#64748B">HET LAB</text>
  <text class="f h" x="544" y="330" text-anchor="middle">Het werk</text>
  <text class="f h" x="544" y="356" text-anchor="middle">gebeurt hier</text>
  <text class="f sm" x="544" y="392" text-anchor="middle">shell, tools, scripts,</text>
  <text class="f sm" x="544" y="412" text-anchor="middle">builds en tests</text>
  <line x1="470" y1="442" x2="618" y2="442" stroke="#CBD5E1" stroke-width="2"/>
  <text class="f sm" x="544" y="472" text-anchor="middle">De agent zelf zit</text>
  <text class="f sm" x="544" y="492" text-anchor="middle">hierbuiten — hij ziet</text>
  <text class="f sm" x="544" y="512" text-anchor="middle">alleen wat poort 2</text>
  <text class="f sm" x="544" y="532" text-anchor="middle">doorlaat.</text>

  <path d="M642 392 L678 392" stroke="#334155" stroke-width="2.5" marker-end="url(#ai)"/>

  <!-- ============ POORT 2 — UITVOER ============ -->
  <rect x="688" y="196" width="380" height="392" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="688" y="196" width="380" height="42" rx="14" fill="#1E293B"/>
  <rect x="688" y="224" width="380" height="14" fill="#1E293B"/>
  <text class="f tag" x="712" y="224" fill="#FFFFFF">POORT 2 · UITVOERCONTROLE</text>

  <text class="f h" x="712" y="272">Wat er terugkomt — hier wordt beslist</text>

  <rect x="712" y="290" width="332" height="76" rx="10" fill="#EFF4FA" stroke="#CBD5E1" stroke-width="1.5"/>
  <text class="f" x="730" y="316" font-size="15.5" font-weight="700" fill="#0B1220">Spoor 1 · de regelset</text>
  <text class="f sm" x="730" y="338">BSN · IBAN · creditcard · telefoon ·</text>
  <text class="f sm" x="730" y="356">de dataset-detector</text>

  <rect x="712" y="376" width="332" height="86" rx="10" fill="#F4F1FB" stroke="#B9A7EE" stroke-width="1.5"/>
  <rect x="946" y="386" width="86" height="20" rx="10" fill="#7C4DEF"/>
  <text class="f pil" x="989" y="400" text-anchor="middle" fill="#FFFFFF">INSTELBAAR</text>
  <text class="f" x="730" y="402" font-size="15.5" font-weight="700" fill="#0B1220">Spoor 2 · klein lokaal model</text>
  <text class="f sm" x="730" y="424">Tweede mening bij twijfel, per lab aan</text>
  <text class="f sm" x="730" y="442">of uit. Geeft een categorie, geen ja/nee.</text>
  <text class="f mono" x="730" y="456" fill="#5B36C7">qwen2.5:1.5b — draait lokaal</text>

  <rect x="712" y="472" width="332" height="68" rx="10" fill="#FCF0F4" stroke="#E9A8C0" stroke-width="1.5"/>
  <text class="f" x="730" y="498" font-size="15.5" font-weight="700" fill="#0B1220">Klopt het met de intentie?</text>
  <text class="f sm" x="730" y="520">Zo niet: <tspan font-weight="700" fill="#9D174D">mismatch</tspan>, en het gaat alsnog dicht.</text>

  <text class="f sm" x="712" y="566">Regels met doel <tspan class="mono" fill="#334155">uitvoer</tspan> gelden hier.</text>

  <!-- ============ UITKOMSTEN ============ -->
  <path d="M1068 258 L1116 258" stroke="#0E9F6E" stroke-width="3" marker-end="url(#ag)"/>
  <rect x="1126" y="212" width="404" height="92" rx="12" fill="#E7F7F1" stroke="#0E9F6E" stroke-width="2"/>
  <text class="f h" x="1152" y="248" fill="#0E7A55">Doorlaten</text>
  <text class="f lab" x="1152" y="276">schema's, kolomnamen, aantallen, aggregaties</text>

  <path d="M1068 392 L1116 392" stroke="#D97706" stroke-width="3" marker-end="url(#aw)"/>
  <rect x="1126" y="346" width="404" height="92" rx="12" fill="#FEF3E2" stroke="#D97706" stroke-width="2"/>
  <text class="f h" x="1152" y="382" fill="#B45309">Maskeren</text>
  <text class="f lab" x="1152" y="410">één BSN hoeft niet het hele antwoord te kosten</text>

  <path d="M1068 526 L1116 526" stroke="#DC2626" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="1126" y="480" width="404" height="92" rx="12" fill="#FDECEC" stroke="#DC2626" stroke-width="2"/>
  <text class="f h" x="1152" y="516" fill="#B91C1C">Blokkeren</text>
  <text class="f lab" x="1152" y="544">ruwe klantrecords gaan niet naar buiten</text>

  <!-- ============ ALLES INSTELBAAR ============ -->
  <rect x="70" y="620" width="980" height="210" rx="14" fill="#F1F5F9"/>
  <rect x="94" y="648" width="86" height="20" rx="10" fill="#7C4DEF"/>
  <text class="f pil" x="137" y="662" text-anchor="middle" fill="#FFFFFF">INSTELBAAR</text>
  <text class="f h" x="196" y="663">Niets hiervan staat vast — dit zet jij zelf</text>

  <rect x="94" y="686" width="298" height="122" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f" x="114" y="714" font-size="15.5" font-weight="700" fill="#0B1220">Profiel per lab</text>
  <text class="f sm" x="114" y="740">Generiek — geen aannames</text>
  <text class="f sm" x="114" y="762">Fabric/Azure — technische uitvoer is normaal</text>
  <text class="f sm" x="114" y="784">Streng — dicht in plaats van gemaskeerd</text>

  <rect x="410" y="686" width="298" height="122" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f" x="430" y="714" font-size="15.5" font-weight="700" fill="#0B1220">Elke regel apart</text>
  <text class="f sm" x="430" y="740">Aan of uit, en op de invoer of de uitvoer</text>
  <text class="f sm" x="430" y="762">Actie per regel: blokkeren · maskeren ·</text>
  <text class="f sm" x="430" y="784">waarschuwen · toelaten</text>

  <rect x="726" y="686" width="298" height="122" rx="11" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f" x="746" y="714" font-size="15.5" font-weight="700" fill="#0B1220">Het tweede spoor</text>
  <text class="f sm" x="746" y="740">Het lokale model per lab aan of uit</text>
  <text class="f sm" x="746" y="762">Welk model, en op welk adres het draait</text>
  <text class="f sm" x="746" y="784">De hele guard kan per lab uit — je ziet het</text>

  <!-- ============ AUDIT ============ -->
  <rect x="1070" y="620" width="460" height="210" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="1094" y="654" fill="#94A3B8">DE AUDIT</text>
  <text class="f h" x="1094" y="686">Achteraf te bewijzen</text>
  <text class="f lab" x="1094" y="716">Wat er gevraagd werd, wat eruit kwam,</text>
  <text class="f lab" x="1094" y="738">welke regel aansloeg, welk profiel en welke</text>
  <text class="f lab" x="1094" y="760">intentie golden, en wat de uitkomst was.</text>
  <rect x="1094" y="778" width="412" height="34" rx="8" fill="#F1F5F9"/>
  <text class="f sm" x="1110" y="800">Versleuteld opgeslagen — de audit is geen nieuw lek.</text>
</svg>
