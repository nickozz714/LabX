<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t3">
  <title id="t3">Van ticket tot resultaat: boards, planningen en werkers</title>
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#3B82F6"/>
    </marker>
    <marker id="av" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#8B5CF6"/>
    </marker>
  </defs>
  <style>
    .f { font-family: Archivo, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: #0B1220; }
    .sub { font-size: 19px; fill: #64748B; }
    .eyebrow { font-size: 14px; font-weight: 700; fill: #94A3B8; letter-spacing: 2.4px; }
    .h { font-size: 20px; font-weight: 700; fill: #0B1220; }
    .lab { font-size: 15.5px; fill: #334155; }
    .sm { font-size: 14px; fill: #64748B; }
    .tag { font-size: 13px; font-weight: 700; letter-spacing: 1.1px; }
    .col { font-size: 13.5px; font-weight: 700; fill: #475569; letter-spacing: 0.6px; }
  </style>

  <rect width="1600" height="900" fill="#FBFCFE"/>
  <rect x="0" y="0" width="1600" height="6" fill="#3B82F6"/>

  <text class="f eyebrow" x="70" y="78">PLAAT 4 — WERK DAT ZICHZELF OPPAKT</text>
  <text class="f title" x="70" y="122">Van ticket tot resultaat</text>
  <text class="f sub" x="70" y="156">Het bord hangt aan een lab. Wie een ticket oppakt, werkt daar — zelfde sandbox, zelfde grenzen.</text>

  <!-- bron -->
  <rect x="70" y="232" width="214" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="177" y="268" text-anchor="middle" fill="#94A3B8">DE BRON</text>
  <rect x="102" y="292" width="150" height="54" rx="9" fill="#F1F5F9"/>
  <text class="f lab" x="177" y="325" text-anchor="middle">Jira Cloud</text>
  <rect x="102" y="358" width="150" height="54" rx="9" fill="#F1F5F9"/>
  <text class="f lab" x="177" y="391" text-anchor="middle">Azure DevOps</text>
  <rect x="102" y="424" width="150" height="54" rx="9" fill="#F1F5F9"/>
  <text class="f lab" x="177" y="457" text-anchor="middle">of alleen LabX</text>
  <text class="f sm" x="177" y="512" text-anchor="middle">Twee kanten op,</text>
  <text class="f sm" x="177" y="534" text-anchor="middle">of alleen lezen</text>

  <path d="M284 372 L344 372" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M344 420 L284 420" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#av)"/>
  <text class="f" x="314" y="360" text-anchor="middle" font-size="12.5" fill="#3B82F6" font-weight="700">pull</text>
  <text class="f" x="314" y="444" text-anchor="middle" font-size="12.5" fill="#8B5CF6" font-weight="700">push</text>

  <!-- bord -->
  <rect x="352" y="232" width="470" height="330" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
  <text class="f tag" x="384" y="268" fill="#3B82F6">HET BORD</text>
  <text class="f h" x="384" y="298">Kolommen, gekoppeld aan één lab</text>

  <rect x="384" y="318" width="96" height="212" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="f col" x="432" y="344" text-anchor="middle">TE DOEN</text>
  <rect x="396" y="356" width="72" height="26" rx="6" fill="#E2E8F0"/>
  <rect x="396" y="390" width="72" height="26" rx="6" fill="#E2E8F0"/>

  <rect x="492" y="318" width="96" height="212" rx="10" fill="#EAF1FE" stroke="#3B82F6" stroke-width="1.5"/>
  <text class="f col" x="540" y="344" text-anchor="middle" fill="#3B82F6">AGENT</text>
  <rect x="504" y="356" width="72" height="26" rx="6" fill="#3B82F6"/>
  <rect x="504" y="390" width="72" height="26" rx="6" fill="#93C0FB"/>
  <rect x="504" y="424" width="72" height="26" rx="6" fill="#93C0FB"/>

  <rect x="600" y="318" width="96" height="212" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="f col" x="648" y="344" text-anchor="middle">REVIEW</text>
  <rect x="612" y="356" width="72" height="26" rx="6" fill="#E2E8F0"/>

  <rect x="708" y="318" width="86" height="212" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="f col" x="751" y="344" text-anchor="middle">KLAAR</text>
  <rect x="720" y="356" width="62" height="26" rx="6" fill="#CFEFE2"/>
  <rect x="720" y="390" width="62" height="26" rx="6" fill="#CFEFE2"/>

  <!-- drie startmanieren -->
  <rect x="352" y="590" width="470" height="224" rx="14" fill="#F1F5F9"/>
  <text class="f tag" x="384" y="626" fill="#64748B">DRIE MANIEREN OM WERK TE STARTEN</text>
  <text class="f h" x="384" y="668">Per ticket</text>
  <text class="f sm" x="384" y="692">"Agent starten", met een extra instructie erbij</text>
  <text class="f h" x="384" y="730">Per bord</text>
  <text class="f sm" x="384" y="754">"Pak werk op" neemt de bovenste uit de agent-kolom</text>
  <text class="f h" x="384" y="792">Op tijd</text>
  <text class="f sm" x="384" y="816">Een cron-schedule doet hetzelfde, vanzelf</text>

  <path d="M822 372 L882 372" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- planning -->
  <rect x="890" y="232" width="286" height="330" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="922" y="268" fill="#94A3B8">DE PLANNING</text>
  <text class="f h" x="922" y="298">Een rij die zichzelf afwerkt</text>

  <rect x="922" y="320" width="222" height="40" rx="8" fill="#EAF1FE" stroke="#3B82F6" stroke-width="1.5"/>
  <text class="f lab" x="938" y="346">1 · SWI-91 — loopt</text>
  <rect x="922" y="370" width="222" height="40" rx="8" fill="#EAF1FE" stroke="#3B82F6" stroke-width="1.5"/>
  <text class="f lab" x="938" y="396">2 · SWI-92 — loopt</text>
  <rect x="922" y="420" width="222" height="40" rx="8" fill="#FEF3E2" stroke="#D97706" stroke-width="1.5"/>
  <text class="f lab" x="938" y="440">3 · SWI-93 — wacht op</text>
  <text class="f sm" x="938" y="456">SWI-91</text>
  <rect x="922" y="470" width="222" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="f lab" x="938" y="496">4 · SWI-94</text>
  <text class="f sm" x="922" y="538">Pauzeren, herschikken en</text>
  <text class="f sm" x="922" y="558">afbreken kan onderweg</text>

  <path d="M1176 372 L1236 372" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- werkers -->
  <rect x="1244" y="232" width="286" height="330" rx="14" fill="#F8FAFF" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text class="f tag" x="1276" y="268" fill="#64748B">HET LAB</text>
  <text class="f h" x="1276" y="298">Werkers pakken parallel op</text>

  <rect x="1276" y="322" width="100" height="92" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text class="f lab" x="1326" y="358" text-anchor="middle">Werker 1</text>
  <text class="f sm" x="1326" y="382" text-anchor="middle">SWI-91</text>
  <rect x="1392" y="322" width="100" height="92" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text class="f lab" x="1442" y="358" text-anchor="middle">Werker 2</text>
  <text class="f sm" x="1442" y="382" text-anchor="middle">SWI-92</text>
  <rect x="1276" y="426" width="216" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="f sm" x="1384" y="452" text-anchor="middle">Werker 3 komt erbij als er</text>
  <text class="f sm" x="1384" y="472" text-anchor="middle">werk wacht — tot jouw plafond</text>
  <text class="f sm" x="1276" y="522">Ze delen /workspace: één werkplaats,</text>
  <text class="f sm" x="1276" y="542">meer handen.</text>

  <!-- ticket anatomy -->
  <rect x="890" y="590" width="640" height="224" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="922" y="626" fill="#94A3B8">EN OP HET TICKET ZELF: DRIE GESCHEIDEN VLAKKEN</text>
  <rect x="922" y="646" width="188" height="140" rx="10" fill="#F8FAFC"/>
  <text class="f h" x="942" y="682">Omschrijving</text>
  <text class="f sm" x="942" y="708">wat er moet gebeuren</text>
  <text class="f sm" x="942" y="730">— jij schrijft dit</text>
  <rect x="1126" y="646" width="188" height="140" rx="10" fill="#F8FAFC"/>
  <text class="f h" x="1146" y="682">Criteria</text>
  <text class="f sm" x="1146" y="708">wanneer het klaar is</text>
  <text class="f sm" x="1146" y="730">— de agent toetst</text>
  <text class="f sm" x="1146" y="752">zich hieraan</text>
  <rect x="1330" y="646" width="170" height="140" rx="10" fill="#EAF1FE"/>
  <text class="f h" x="1350" y="682">Tijdlijn</text>
  <text class="f sm" x="1350" y="708">voortgang en</text>
  <text class="f sm" x="1350" y="730">bevindingen</text>
  <text class="f sm" x="1350" y="752">— hier hoort het</text>
  <text class="f sm" x="1350" y="774">verslag</text>
</svg>
